spring.application.name=projectpothels

# Database connection - jdbc: prefix manually added since Railway's DATABASE_URL doesn't include it
spring.datasource.url=jdbc:${DATABASE_URL:postgresql://localhost:5432/pothels}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# File upload settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Server & frontend
server.port=${PORT:8080}
frontend.url=${FRONTEND_URL:http://localhost:8888}